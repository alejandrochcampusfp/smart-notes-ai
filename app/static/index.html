<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNotes AI - Gestor Inteligente</title>
    <!-- Tailwind CSS para un diseño corporativo moderno y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Cabecera -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">🧠 SmartNotes AI</h1>
            <span class="text-xs bg-indigo-500 py-1 px-3 rounded-full font-medium">FastAPI + Groq IA</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl w-full mx-auto p-6 flex-grow grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Formulario para crear notas -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
            <h2 class="text-lg font-semibold text-slate-700 mb-4">Nueva Nota Inteligente</h2>
            <form id="noteForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Título</label>
                    <input type="text" id="title" required maxlength="100" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Ej: Ideas para el proyecto">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Contenido</label>
                    <textarea id="content" required rows="4" maxlength="2000" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Escribe aquí tu nota... La IA generará un resumen automático."></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200 text-sm shadow-sm">
                    Guardar y Resumir con IA
                </button>
            </form>
        </section>

        <!-- Listado de notas -->
        <section class="md:col-span-2 space-y-4">
            <h2 class="text-lg font-semibold text-slate-700">Tus Notas Registradas</h2>
            <div id="notesList" class="space-y-4">
                <!-- Las notas se cargarán aquí dinámicamente -->
                <p class="text-slate-400 text-sm italic">Cargando notas...</p>
            </div>
        </section>

    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-400">
        Desarrollado con estándares de seguridad profesionales para Portfolio DAM.
    </footer>

    <!-- Lógica JavaScript pura y limpia -->
    <script>
        const API_URL = "";

        async function fetchNotes() {
            try {
                const response = await fetch(`${API_URL}/api/notes`);
                const notes = await response.json();
                const container = document.getElementById("notesList");
                
                if (notes.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-sm bg-white p-4 rounded-xl border border-slate-200">No hay notas guardadas todavía. ¡Crea una a la izquierda!</p>`;
                    return;
                }

                container.innerHTML = notes.map(note => `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-2 relative">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800 text-base">${escapeHtml(note.title)}</h3>
                            <button onclick="deleteNote(${note.id})" class="text-slate-400 hover:text-red-500 text-xs font-medium transition">Eliminar</button>
                        </div>
                        <p class="text-slate-600 text-sm whitespace-pre-line">${escapeHtml(note.content)}</p>
                        ${note.ai_summary ? `
                            <div class="mt-3 bg-indigo-50 border-l-4 border-indigo-500 p-3 rounded-r-lg">
                                <p class="text-xs font-semibold text-indigo-700 uppercase tracking-wider">Resumen IA</p>
                                <p class="text-xs text-indigo-900 mt-1">${escapeHtml(note.ai_summary)}</p>
                            </div>
                        ` : ''}
                        <span class="block text-[10px] text-slate-400 pt-1">${new Date(note.created_at).toLocaleString()}</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error al cargar notas:", error);
            }
        }

        document.getElementById("noteForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;
            const btn = document.getElementById("submitBtn");

            btn.disabled = true;
            btn.textContent = "Procesando con IA...";

            try {
                const response = await fetch(`${API_URL}/api/notes`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    document.getElementById("noteForm").reset();
                    fetchNotes();
                } else {
                    alert("Error al validar los datos de la nota.");
                }
            } catch (error) {
                console.error("Error:", error);
            } finally {
                btn.disabled = false;
                btn.textContent = "Guardar y Resumir con IA";
            }
        });

        async function deleteNote(id) {
            if (!confirm("¿Estás seguro de eliminar esta nota?")) return;
            try {
                const response = await fetch(`${API_URL}/api/notes/${id}`, { method: "DELETE" });
                if (response.ok) fetchNotes();
            } catch (error) {
                console.error("Error al eliminar:", error);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchNotes();
    </script>
</body>
</html>
